name: build obs plugin

on:
  push:
    branches: [ main ]
    tags: [ '*' ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PLUGIN_NAME: source-record
jobs:
  meta:
    name: Meta
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    outputs:
      short_sha: ${{ steps.vars.outputs.short_sha }}
      full_sha: ${{ steps.vars.outputs.full_sha }}
      file_date: ${{ steps.vars.outputs.file_date }}
      obs_ref: ${{ steps.vars.outputs.obs_ref }}
      windows_deps_version: ${{ steps.vars.outputs.windows_deps_version }}
      windows_platform_sdk: ${{ steps.vars.outputs.windows_platform_sdk }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4.1.1

      - name: Compute shared workflow variables
        id: vars
        shell: bash
        run: |
          echo "short_sha=${GITHUB_SHA::9}" >> "$GITHUB_OUTPUT"
          echo "full_sha=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "file_date=$(date +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          with open("buildspec.json", encoding="utf-8") as f:
              buildspec = json.load(f)

          obs_ref = buildspec["dependencies"]["obs-studio"]["hash"]
          windows_deps = buildspec["dependencies"]["prebuilt"]["version"]
          sdk_x64 = buildspec["platformConfig"]["windows-x64"]["platformSDK"]
          sdk_x86 = buildspec["platformConfig"]["windows-x86"]["platformSDK"]
          if sdk_x64 != sdk_x86:
              raise SystemExit("windows x86/x64 platformSDK mismatch in buildspec.json")

          print(f"obs_ref={obs_ref}")
          print(f"windows_deps_version={windows_deps}")
          print(f"windows_platform_sdk={sdk_x64}")
          PY

  macos:
    name: macOS
    needs: [meta]
    runs-on: macos-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, arm64, universal]
    env:
      CODESIGN_IDENT: '-'
      CODESIGN_IDENT_INSTALLER: ''
      MACOSX_DEPLOYMENT_TARGET: '10.15'  
    defaults:
      run:
        shell: zsh {0}
    steps:
      - name: Checkout
        uses: actions/checkout@v4.1.1
        with:
          path: plugin
          submodules: recursive

      - name: Checkout obs-studio
        uses: actions/checkout@v4.1.1
        with:
          repository: 'obsproject/obs-studio'
          ref: ${{ needs.meta.outputs.obs_ref }}
          path: obs-studio
          fetch-depth: 0
          submodules: recursive

      - name: Setup Environment
        id: setup
        working-directory: ${{ github.workspace }}/plugin
        run: |
          ## SETUP ENVIRONMENT SCRIPT
          print '::group::Clean Homebrew Environment'
          typeset -a to_remove=()

          for formula (speexdsp curl php) {
            if [[ -d ${HOMEBREW_PREFIX}/opt/${formula} ]] to_remove+=(${formula})
          }

          if (( #to_remove > 0 )) brew uninstall --ignore-dependencies ${to_remove}
          print '::endgroup::'

          print '::group::Set up code signing'
          if [[ '${{ secrets.MACOS_SIGNING_APPLICATION_IDENTITY }}' != '' && \
                '${{ secrets.MACOS_SIGNING_INSTALLER_IDENTITY }}' != '' && \
                '${{ secrets.MACOS_SIGNING_CERT }}' != '' ]] {
            print 'haveCodesignIdent=true' >> $GITHUB_OUTPUT
          } else {
            print 'haveCodesignIdent=false' >> $GITHUB_OUTPUT
          }

          if [[ '${{ secrets.MACOS_NOTARIZATION_USERNAME }}' != '' && \
                '${{ secrets.MACOS_NOTARIZATION_PASSWORD }}' != '' ]] {
            print 'haveNotarizationUser=true' >> $GITHUB_OUTPUT
          } else {
            print 'haveNotarizationUser=false' >> $GITHUB_OUTPUT
          }
          print '::endgroup::'

          print "ccacheDate=$(date +"%Y-%m-%d")" >> $GITHUB_OUTPUT

      - name: Install Apple Developer Certificate
        if: ${{ github.event_name != 'pull_request' && steps.setup.outputs.haveCodesignIdent == 'true' }}
        uses: apple-actions/import-codesign-certs@253ddeeac23f2bdad1646faac5c8c2832e800071
        with:
          keychain-password: ${{ github.run_id }}
          p12-file-base64: ${{ secrets.MACOS_SIGNING_CERT }}
          p12-password: ${{ secrets.MACOS_SIGNING_CERT_PASSWORD }}

      - name: Set Signing Identity
        if: ${{ github.event_name != 'pull_request' && steps.setup.outputs.haveCodesignIdent == 'true' }}
        run: |
          print "CODESIGN_IDENT=${{ secrets.MACOS_SIGNING_APPLICATION_IDENTITY }}" >> $GITHUB_ENV
          print "CODESIGN_IDENT_INSTALLER=${{ secrets.MACOS_SIGNING_INSTALLER_IDENTITY }}" >> $GITHUB_ENV

      - name: Build Plugin
        uses: ./plugin/.github/actions/build-plugin
        with:
          workingDirectory: ${{ github.workspace }}/plugin
          target: ${{ matrix.arch }}
          config: RelWithDebInfo
          codesign: 'true'
          codesignIdent: ${{ env.CODESIGN_IDENT }}

      - name: Package Plugin
        uses: ./plugin/.github/actions/package-plugin
        with:
          workingDirectory: ${{ github.workspace }}/plugin
          target: ${{ matrix.arch }}
          config: RelWithDebInfo
          codesign: ${{ github.event_name != 'pull_request' && steps.setup.outputs.haveCodesignIdent == 'true' }}
          notarize: ${{ startsWith(github.ref, 'refs/tags/') && github.event_name != 'pull_request' && steps.setup.outputs.haveNotarizationUser == 'true' }}
          codesignIdent: ${{ env.CODESIGN_IDENT }}
          installerIdent: ${{ env.CODESIGN_IDENT_INSTALLER }}
          codesignUser: ${{ secrets.MACOS_NOTARIZATION_USERNAME }}
          codesignPass: ${{ secrets.MACOS_NOTARIZATION_PASSWORD }}

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4.3.1
        with:
          name: ${{ env.PLUGIN_NAME }}-macos-${{ matrix.arch }}-${{ needs.meta.outputs.short_sha }}
          path: ${{ github.workspace }}/plugin/release/${{ env.PLUGIN_NAME }}-*-macos-${{ matrix.arch }}.pkg
  linux-in-tree:
    name: 'Linux'
    needs: [meta]
    runs-on: ${{ matrix.ubuntu }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        ubuntu: ['ubuntu-22.04']
    steps:
      - name: Checkout
        uses: actions/checkout@v4.1.1
        with:
          repository: obsproject/obs-studio
          ref: ${{ needs.meta.outputs.obs_ref }}
          fetch-depth: 0
          submodules: 'recursive'
      - name: "Checkout plugin"
        uses: actions/checkout@v4.1.1
        with:
          path: plugins/${{ env.PLUGIN_NAME }}
      - name: Add plugin to obs cmake
        shell: bash
        run: echo "add_subdirectory(${{ env.PLUGIN_NAME }})" > plugins/CMakeLists.txt
      - name: 'Install dependencies'
        run: CI/linux/01_install_dependencies.sh --disable-pipewire
      - name: 'Configure'
        shell: bash
        run: |
          mkdir ./build
          cmake -S . -B "./build" -G Ninja -DCMAKE_BUILD_TYPE="RelWithDebInfo" -DLINUX_PORTABLE=OFF -DENABLE_AJA=OFF -DENABLE_NEW_MPEGTS_OUTPUT=OFF -DBUILD_CAPTIONS=OFF -DWITH_RTMPS=OFF -DBUILD_BROWSER=OFF -DBUILD_VIRTUALCAM=OFF -DBUILD_VST=OFF -DENABLE_PIPEWIRE=OFF -DENABLE_SCRIPTING=OFF
      - name: 'Build'
        shell: bash
        run: |
          cmake --build "./build"
      - name: 'Package'
        shell: bash
        run: |
          FILE_DATE=$(date +%Y-%m-%d)
          FILE_NAME=${{ env.PLUGIN_NAME }}-$FILE_DATE-${{ needs.meta.outputs.full_sha }}-${{ matrix.ubuntu }}.tar.gz
          echo "FILE_NAME=${FILE_NAME}" >> $GITHUB_ENV
          mkdir -p ./${{ env.PLUGIN_NAME }}/bin/64bit/
          mv ./build/plugins/${{ env.PLUGIN_NAME }}/${{ env.PLUGIN_NAME }}.so ./${{ env.PLUGIN_NAME }}/bin/64bit/${{ env.PLUGIN_NAME }}.so
          mv ./plugins/${{ env.PLUGIN_NAME }}/data ./${{ env.PLUGIN_NAME }}/data
          tar -cvzf "${FILE_NAME}" ${{ env.PLUGIN_NAME }}
      - name: 'Publish'
        uses: actions/upload-artifact@v4.3.1
        with:
          name: '${{ env.FILE_NAME }}'
          path: '*.tar.gz'
  windows-build:
    name: 'Windows Build'
    needs: [meta]
    runs-on: [windows-latest]
    timeout-minutes: 180
    strategy:
      fail-fast: true
      matrix:
        target: [x64, x86]
        include:
          - target: x64
            cmake_build: 'x64'
            deps_ext: '64'
          - target: x86
            cmake_build: 'Win32'
            deps_ext: '32'
    env:
      CMAKE_GENERATOR: "Visual Studio 17 2022"
      CMAKE_SYSTEM_VERSION: ${{ needs.meta.outputs.windows_platform_sdk }}
      WINDOWS_DEPS_VERSION: ${{ needs.meta.outputs.windows_deps_version }}
    steps:
      - name: Add msbuild to PATH
        # v2 tag pinned to immutable commit for supply-chain hardening.
        uses: microsoft/setup-msbuild@6fb02220983dee41ce7ae257b6f4d8f9bf5ed4ce
      - name: Checkout obs
        uses: actions/checkout@v4.1.1
        with:
          repository: obsproject/obs-studio
          ref: ${{ needs.meta.outputs.obs_ref }}
          fetch-depth: 0
          submodules: 'recursive'
      - name: Checkout plugin
        uses: actions/checkout@v4.1.1
        with:
          path: plugins/${{ env.PLUGIN_NAME}}
      - name: Add plugin to obs cmake
        shell: cmd
        run: echo add_subdirectory(${{ env.PLUGIN_NAME }}) > plugins/CMakeLists.txt
      - name: 'Install prerequisite: QT'
        run: |
          $qtArchive="windows-deps-qt6-${{ env.WINDOWS_DEPS_VERSION }}-${{ matrix.target }}.zip"
          $qtUrl="https://github.com/obsproject/obs-deps/releases/download/${{ env.WINDOWS_DEPS_VERSION }}/$qtArchive"
          Invoke-WebRequest -Uri $qtUrl -OutFile $qtArchive -MaximumRetryCount 5 -RetryIntervalSec 5
          $targetKey="windows-${{ matrix.target }}"
          $buildspec = Get-Content ".\\plugins\\${{ env.PLUGIN_NAME }}\\buildspec.json" -Raw | ConvertFrom-Json
          $expectedHash = $buildspec.dependencies.qt6.hashes."$targetKey".ToLower()
          $actualHash = (Get-FileHash -Path $qtArchive -Algorithm SHA256).Hash.ToLower()
          if ($actualHash -ne $expectedHash) {
            throw "Checksum mismatch for $qtArchive. Expected $expectedHash, got $actualHash."
          }
          7z x $qtArchive -o"${{ github.workspace }}/cmbuild/deps"
      - name: 'Install prerequisite: Pre-built dependencies'
        run: |
          $depsArchive="windows-deps-${{ env.WINDOWS_DEPS_VERSION }}-${{ matrix.target }}.zip"
          $depsUrl="https://github.com/obsproject/obs-deps/releases/download/${{ env.WINDOWS_DEPS_VERSION }}/$depsArchive"
          Invoke-WebRequest -Uri $depsUrl -OutFile $depsArchive -MaximumRetryCount 5 -RetryIntervalSec 5
          $targetKey="windows-${{ matrix.target }}"
          $buildspec = Get-Content ".\\plugins\\${{ env.PLUGIN_NAME }}\\buildspec.json" -Raw | ConvertFrom-Json
          $expectedHash = $buildspec.dependencies.prebuilt.hashes."$targetKey".ToLower()
          $actualHash = (Get-FileHash -Path $depsArchive -Algorithm SHA256).Hash.ToLower()
          if ($actualHash -ne $expectedHash) {
            throw "Checksum mismatch for $depsArchive. Expected $expectedHash, got $actualHash."
          }
          7z x $depsArchive -o"${{ github.workspace }}/cmbuild/deps"
      - name: Configure
        run: |
          mkdir ./package
          mkdir ./installer
          mkdir ./installer/media
          mkdir ./build
          cmake -S . -B "${{ github.workspace }}/build" -G"${{ env.CMAKE_GENERATOR }}" -DCMAKE_PREFIX_PATH:PATH="${{ github.workspace }}/cmbuild/deps" -A"${{ matrix.cmake_build }}" -DCMAKE_SYSTEM_VERSION="${{ env.CMAKE_SYSTEM_VERSION }}" -DBUILD_BROWSER=false -DBUILD_VST=false -DBUILD_VIRTUALCAM=false -DBUILD_CAPTIONS=false -DCOMPILE_D3D12_HOOK=false -DENABLE_SCRIPTING=false -DDepsPath="${{ github.workspace }}/cmbuild/deps" -DDepsPath${{ matrix.deps_ext }}="${{ github.workspace }}/cmbuild/deps" -DQTDIR="${{ github.workspace }}/cmbuild/deps/qt6" -DCOPIED_DEPENDENCIES=FALSE -DCOPY_DEPENDENCIES=TRUE -DENABLE_PLUGINS=TRUE -DDISABLE_PLUGINS=FALSE -DENABLE_BROWSER=FALSE -DENABLE_WEBSOCKET=FALSE
      - name: 'Build'
        run: msbuild /m /p:Configuration=RelWithDebInfo .\build\obs-studio.sln
      - name: Package
        if: success()
        run: |
          $env:FILE_NAME="${{ env.PLUGIN_NAME }}-${{ needs.meta.outputs.full_sha }}-windows-${{ matrix.target }}"
          echo "FILE_NAME=${env:FILE_NAME}" >> ${env:GITHUB_ENV}
          robocopy .\build\rundir\RelWithDebInfo\obs-plugins\${{ matrix.deps_ext }}bit\ .\package\obs-plugins\${{ matrix.deps_ext }}bit ${{ env.PLUGIN_NAME }}.* /E /XF .gitignore
          robocopy .\build\rundir\RelWithDebInfo\data\obs-plugins\${{ env.PLUGIN_NAME }}\ .\package\data\obs-plugins\${{ env.PLUGIN_NAME }}\ /E /XF .gitignore
          copy .\build\plugins\${{ env.PLUGIN_NAME }}\installer.iss .\installer\installer.iss
          robocopy .\plugins\${{ env.PLUGIN_NAME}}\media\ .\installer\media\ /E /XF .gitignore
          exit 0
      - name: Publish zip
        if: success()
        uses: actions/upload-artifact@v4.3.1
        with:
          name: '${{ env.FILE_NAME }}'
          path: package/*
      - name: Publish Installer Files
        if: success() && matrix.target == 'x64'
        uses: actions/upload-artifact@v4.3.1
        with:
          name: 'installer-files'
          path: installer/*
  windows-package:
    name: 'Windows Package'
    runs-on: [windows-latest]
    needs: [meta, windows-build]
    timeout-minutes: 60
    steps:
      - name: Init
        if: success()
        run: |
          mkdir ./package
          $env:FILE_DATE='${{ needs.meta.outputs.file_date }}'
          $env:FILE_NAME="${{ env.PLUGIN_NAME }}-${env:FILE_DATE}-${{ needs.meta.outputs.full_sha }}-windows"
          echo "FILE_NAME=${env:FILE_NAME}" >> ${env:GITHUB_ENV}
          # Contract: these names must match windows-build artifact names.
          $env:FILE_NAME_X86="${{ env.PLUGIN_NAME }}-${{ needs.meta.outputs.full_sha }}-windows-x86"
          echo "FILE_NAME_X86=${env:FILE_NAME_X86}" >> ${env:GITHUB_ENV}
          $env:FILE_NAME_X64="${{ env.PLUGIN_NAME }}-${{ needs.meta.outputs.full_sha }}-windows-x64"
          echo "FILE_NAME_X64=${env:FILE_NAME_X64}" >> ${env:GITHUB_ENV}
      - name: Retrieve x86 build
        uses: actions/download-artifact@v4.1.2
        with:
          name: '${{ env.FILE_NAME_X86 }}'
          path: ./package
      - name: Retrieve x64 build
        uses: actions/download-artifact@v4.1.2
        with:
          name: '${{ env.FILE_NAME_X64 }}'
          path: ./package
      - name: Retrieve installer files
        uses: actions/download-artifact@v4.1.2
        with:
          name: 'installer-files'
          path: .
      - name: Publish zip
        if: success()
        uses: actions/upload-artifact@v4.3.1
        with:
          name: '${{ env.FILE_NAME }}'
          path: package/*
      - name: Resolve Inno Setup Compiler
        run: |
          $iscc = (Get-Command ISCC.exe -ErrorAction SilentlyContinue).Source

          if (-not $iscc) {
            # Officially documented by Inno Setup:
            # winget install --id JRSoftware.InnoSetup -e -s winget -i
            winget install --id JRSoftware.InnoSetup -e -s winget --accept-package-agreements --accept-source-agreements --silent
            $iscc = (Get-Command ISCC.exe -ErrorAction SilentlyContinue).Source
          }

          if (-not $iscc) {
            $candidate = "C:\\Program Files (x86)\\Inno Setup 6\\ISCC.exe"
            if (Test-Path $candidate) {
              $iscc = $candidate
            }
          }

          if (-not $iscc) {
            throw "ISCC.exe not found. Inno Setup is expected on windows-latest, or install must succeed via winget."
          }

          echo "INNO_ISCC=$iscc" >> ${env:GITHUB_ENV}
      - name: "Package Installer (Compile)"
        run: |
          & "${env:INNO_ISCC}" /Qp ".\installer.iss"
      - name: Publish installer
        if: success()
        uses: actions/upload-artifact@v4.3.1
        with:
          name: '${{ env.FILE_NAME }}-installer'
          path: package/*.exe
